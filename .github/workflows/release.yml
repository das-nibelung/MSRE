name: Release personal plugin

on:
    push:
        branches:
            - personal-main
        paths:
            - manifest.json
            - package.json
            - pnpm-lock.yaml
            - src/**
            - styles.css
            - esbuild.config.mjs
            - .github/workflows/release.yml
    workflow_dispatch:

permissions:
    contents: write

env:
    PLUGIN_NAME: personal-spaced-repetition

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "24"

            - name: Install pnpm
              run: npm install --global pnpm@11.6.0

            - name: Test and build
              run: |
                  pnpm install --frozen-lockfile
                  pnpm exec jest --runInBand
                  pnpm exec tsc --noEmit --skipLibCheck
                  node esbuild.config.mjs production

            - name: Read plugin version
              id: version
              run: echo "value=$(node -p \"require('./manifest.json').version\")" >> "$GITHUB_OUTPUT"

            - name: Package plugin
              run: |
                  mkdir "$PLUGIN_NAME"
                  cp build/main.js manifest.json styles.css "$PLUGIN_NAME/"
                  zip -r "$PLUGIN_NAME.zip" "$PLUGIN_NAME"

            - name: Create or update GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.version.outputs.value }}
              run: |
                  if gh release view "$VERSION" >/dev/null 2>&1; then
                      gh release upload "$VERSION" \
                          build/main.js manifest.json styles.css "$PLUGIN_NAME.zip" \
                          --clobber
                  else
                      gh release create "$VERSION" \
                          build/main.js manifest.json styles.css "$PLUGIN_NAME.zip" \
                          --target "$GITHUB_SHA" \
                          --title "$VERSION" \
                          --notes "Personal Spaced Repetition $VERSION"
                  fi
